<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Orbit community chat</title>
  <desc id="description">An abstract dark banner with an orbit mark and overlapping conversation cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111522"/>
      <stop offset="1" stop-color="#090b11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6a8ff"/>
      <stop offset="1" stop-color="#7763ef"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#background)"/>
  <circle cx="850" cy="170" r="115" fill="#806cf8" opacity=".12" filter="url(#glow)"/>
  <path d="M0 278C204 227 332 340 541 290s383-70 659-5v55H0z" fill="#151927" opacity=".62"/>
  <g transform="translate(104 170)">
    <ellipse rx="64" ry="25" fill="none" stroke="#9382ff" stroke-width="2.5" transform="rotate(-32)"/>
    <ellipse rx="64" ry="25" fill="none" stroke="#6855d6" stroke-width="2" transform="rotate(32)"/>
    <circle r="20" fill="url(#accent)"/>
    <circle cx="53" cy="-34" r="7" fill="#c2b8ff"/>
    <circle cx="-53" cy="34" r="6" fill="#7763ef"/>
  </g>
  <text x="202" y="158" fill="#f3f1ff" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="750" letter-spacing="-2">Orbit</text>
  <text x="205" y="199" fill="#a7a9ba" font-family="Inter,Segoe UI,sans-serif" font-size="18">Community conversations, in sync.</text>
  <g transform="translate(688 77)">
    <rect width="404" height="186" rx="18" fill="#171b27" stroke="#2b3040"/>
    <rect x="22" y="23" width="9" height="9" rx="4.5" fill="#8f7cff"/>
    <rect x="42" y="24" width="94" height="7" rx="3.5" fill="#777d90"/>
    <rect x="22" y="57" width="264" height="43" rx="12" fill="#222638"/>
    <circle cx="43" cy="78" r="9" fill="#9a8bff"/>
    <rect x="61" y="70" width="119" height="6" rx="3" fill="#c5c6d0"/>
    <rect x="61" y="82" width="191" height="5" rx="2.5" fill="#686e82"/>
    <rect x="105" y="111" width="277" height="43" rx="12" fill="#302b50" stroke="#51467f"/>
    <circle cx="126" cy="132" r="9" fill="#62d5a5"/>
    <rect x="144" y="124" width="146" height="6" rx="3" fill="#dedaff"/>
    <rect x="144" y="136" width="201" height="5" rx="2.5" fill="#9790bb"/>
  </g>
  <circle cx="1105" cy="83" r="4" fill="#6ed9af"/>
  <circle cx="1140" cy="83" r="4" fill="#998aff"/>
</svg>
